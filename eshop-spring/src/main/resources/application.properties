spring.application.name=eshop-spring
# P?ipojovací údaje k MySQL databázi v Dockeru
spring.datasource.url=jdbc:mysql://localhost:3306/eshop_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=eshop_user
spring.datasource.password=eshop_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate nastavení - automaticky vytvo?í tabulky v DB podle na?ich Java t?íd
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
